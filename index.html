<!DOCTYPE html>
<html>
<head>
    <style>body, html { margin: 0; overflow: hidden; background: #000; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<script>
    const canvas = document.getElementById('glCanvas');
    const gl = canvas.getContext('webgl');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    const vs = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `
        precision highp float;
        uniform vec2 res;
        uniform float time;

        mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }
        
        float map(vec3 p) {
            p.xz *= rot(time * 0.2);
            p.xy *= rot(time * 0.1);
            // تقليل التكرار من 8 إلى 5 لضمان عمل الكود على كل الأجهزة
            for(int i = 0; i < 5; i++) {
                p = abs(p) - 0.5;
                if(p.x < p.y) p.xy = p.yx;
                if(p.x < p.z) p.xz = p.zx;
                p *= 1.2;
            }
            return length(p) - 0.1;
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy * 2.0 - res) / min(res.x, res.y);
            vec3 ro = vec3(0, 0, -3), rd = normalize(vec3(uv, 1.5)), p;
            float t = 0.0;
            for(int i = 0; i < 60; i++) { // تقليل خطوات الـ Raymarching
                p = ro + rd * t;
                float d = map(p);
                if(d < 0.001 || t > 10.0) break;
                t += d * 0.5;
            }
            vec3 col = vec3(0.5 + 0.5 * sin(t), 0.5 + 0.5 * cos(t), 0.5 + 0.5 * sin(t + time));
            gl_FragColor = vec4(col * (1.0 - t * 0.1), 1.0);
        }
    `;

    function createShader(gl, type, source) {
        const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); 
        // التحقق من وجود أخطاء في الكود
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, createShader(gl, gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, createShader(gl, gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pos = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    function render(t) {
        gl.uniform2f(gl.getUniformLocation(prog, "res"), canvas.width, canvas.height);
        gl.uniform1f(gl.getUniformLocation(prog, "time"), t * 0.001);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
    }
    render(0);
</script>
</body>
</html>
