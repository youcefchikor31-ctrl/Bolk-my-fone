<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار الضغط الشامل</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <canvas id="glCanvas"></canvas>

    <script>
        // --- 1. الرسوميات الثقيلة (GPU Stress) ---
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fs = `
            precision highp float;
            uniform float time;
            void main() {
                vec2 uv = (gl_FragCoord.xy * 2.0 - vec2(800.0, 600.0)) / 600.0;
                vec3 col = vec3(0.0);
                for(int i = 0; i < 15; i++) {
                    uv = abs(uv) / dot(uv, uv) - 0.7;
                    col += 0.05 * abs(vec3(cos(uv.x * 2.0 + time), sin(uv.y * 3.0 + time), sin(uv.x + uv.y)));
                }
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, createShader(gl, gl.VERTEX_SHADER, "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }"));
        gl.attachShader(prog, createShader(gl, gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(prog); gl.useProgram(prog);

        const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const pos = gl.getAttribLocation(prog, "p");
        gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

        function render(t) {
            gl.uniform1f(gl.getUniformLocation(prog, "time"), t * 0.001);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render(0);

        // --- 2. استنزاف المعالج (CPU Stress) ---
        // هذه الحلقة تعمل في الخلفية وتجبر المعالج على القيام بعمليات حسابية لا نهائية
        function stressCPU() {
            console.log("بدء استنزاف المعالج...");
            while(true) {
                Math.sqrt(Math.random() * Math.random());
                Math.pow(Math.random(), Math.random());
            }
        }
        
        // تحذير: هذا سيجعل المتصفح يطلب إغلاق الصفحة فوراً
        setTimeout(stressCPU, 2000); 

    </script>
</body>
</html>
