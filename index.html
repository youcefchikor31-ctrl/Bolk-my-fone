<!DOCTYPE html>
<html>
<head>
    <title>اختبار التعليق</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: red; /* لون أحمر لتنبيه التعليق */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="msg">سيتم تجميد المتصفح الآن...</div>

    <script>
        // إيقاف أي تفاعل مع الصفحة
        document.body.style.pointerEvents = "none";

        // تأخير بسيط ليبدأ التعليق بعد ثانية
        setTimeout(() => {
            document.getElementById('msg').innerText = "تم التجميد!";
            
            // حلقة لا نهائية تستهلك المعالج بالكامل
            // سيؤدي هذا لتوقف الصفحة عن الاستجابة فوراً
            while (true) {
                console.log("تعليق...");
            }
        }, 1000);
    </script>
</body>
</html>
